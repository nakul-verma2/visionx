<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionX: Explore the System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap');
        
        :root {
            --primary: #0a192f;
            --secondary: #172a45;
            --accent: #64ffda;
            --text: #e6f1ff;
            --highlight: #ff5678;
            --glow: rgba(100, 255, 218, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--primary);
            color: var(--text);
            overflow-x: hidden;
        }
        
        #universe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle 4s infinite ease-in-out;
            will-change: opacity;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: 3px;
        }
        
        .nav-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, rgba(10, 25, 47, 0.9), transparent);
            padding: 1rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: var(--accent);
        }
        
        header {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        
        header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--accent), var(--highlight));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        
        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
        }
        
        section {
            padding: 4rem 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        
        section.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .upload-container {
            background: var(--secondary);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            margin: 2rem auto;
            max-width: 800px;
            border-left: 5.px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .button-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .upload-button {
            background: linear-gradient(45deg, var(--accent), var(--highlight));
            border: none;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-button:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px var(--glow);
        }
        
        .upload-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-indicator {
            display: none;
            margin: 2rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid var(--accent);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .preview-container {
            margin: 2rem auto;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            background: var(--secondary);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
        }
        
        .preview-placeholder {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            letter-spacing: 2px;
        }
        
        .results-container {
            display: none;
            margin: 2rem auto;
            max-width: 800px;
        }
        
        .results-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .result-card {
            background: var(--secondary);
            padding: 1.5rem;
            border-radius: 12px;
            border-top: 3px solid var(--highlight);
            text-align: center;
        }
        
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse-anim 1.5s infinite;
        }
        
        @keyframes pulse-anim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="universe"></div>
    
    <nav class="nav-bar">
        <div class="logo">VisionX</div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>
    
    <header>
        <div class="container">
            <h1>Analyze Equipment</h1>
            <p class="subtitle">Upload a singular image from the station deck for critical asset verification.</p>
        </div>
    </header>
    
    <section class="visible">
        <div class="container">
            <div class="upload-container">
                <div class="button-grid">
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                    <button class="upload-button" onclick="document.getElementById('imageUpload').click()">Select Image</button>
                    <button class="upload-button" id="analyzeButton" disabled>Start Analysis</button>
                </div>
                <div class="progress-indicator" id="progressIndicator"></div>
            </div>
            
            <div class="preview-container">
                <div class="preview-placeholder" id="previewPlaceholder">READY FOR SCAN</div>
                <img id="previewImage" class="preview-image" style="display: none;">
            </div>
            
            <div class="results-container" id="resultsContainer">
                <h3 class="results-title">Scan Results</h3>
                <div class="results-grid" id="resultsList"></div>
            </div>
        </div>
    </section>
    
    <script>
        const universe = document.getElementById('universe');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = `${Math.random() * 2}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            universe.appendChild(star);
        }
        
        const imageUpload = document.getElementById('imageUpload');
        const analyzeButton = document.getElementById('analyzeButton');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewImage = document.getElementById('previewImage');
        const progressIndicator = document.getElementById('progressIndicator');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        
        let uploadedFilename = null;
        
        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            progressIndicator.style.display = 'block';
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch('/upload_image', { method: 'POST', body: formData });
                const result = await response.json();
                
                if (response.ok) {
                    uploadedFilename = result.filename;
                    previewPlaceholder.style.display = 'none';
                    previewImage.style.display = 'block';
                    previewImage.src = URL.createObjectURL(file);
                    analyzeButton.disabled = false;
                    resultsContainer.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            } finally {
                progressIndicator.style.display = 'none';
            }
        });
        
        analyzeButton.addEventListener('click', async () => {
            if (!uploadedFilename) return;
            
            progressIndicator.style.display = 'block';
            analyzeButton.disabled = true;
            
            try {
                const response = await fetch(`/analyze_image/${uploadedFilename}`);
                const result = await response.json();
                
                if (response.ok) {
                    previewImage.src = result.image;
                    resultsContainer.style.display = 'block';
                    resultsList.innerHTML = result.detections.length > 0
                        ? result.detections.map(d => `
                            <div class="result-card">
                                <p><span class="pulse"></span><strong>${d.label}</strong></p>
                                <p>${(d.confidence * 100).toFixed(1)}%</p>
                            </div>
                        `).join('')
                        : '<div class="result-card"><p>No assets found</p></div>';
                }
            } catch (err) {
                console.error(err);
            } finally {
                progressIndicator.style.display = 'none';
                analyzeButton.disabled = false;
            }
        });
        
        document.querySelectorAll('header, section').forEach(el => el.classList.add('visible'));
    </script>
</body>
</html>
